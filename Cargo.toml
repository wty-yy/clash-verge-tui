[package]
name = "clash-verge-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal interface for a future full-featured mihomo client"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
