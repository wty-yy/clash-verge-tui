name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gsettings-desktop-schemas
      - run: sh -n scripts/install.sh
      - name: Check the pinned installer version
        run: |
          test "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$(sed -n 's/^release_version="\([^"]*\)"/\1/p' scripts/install.sh)"
      - run: python3 scripts/test-install.py
      - run: node --test deploy/gh-mirror/*.test.mjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: ./target/release/clash-verge-tui --version
