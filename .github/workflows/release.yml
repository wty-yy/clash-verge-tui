name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag and package version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package TUI and pinned mihomo
        env:
          APP_VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          APP_VERSION="${APP_VERSION#v}" ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.architecture }}
          path: |
            dist/clash-verge-tui-*.tar.gz
            dist/clash-verge-tui-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Add installer to release assets
        run: cp scripts/install.sh dist/install.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/clash-verge-tui-*.tar.gz
            dist/clash-verge-tui-*.tar.gz.sha256
            dist/install.sh
